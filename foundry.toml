[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Fuzz testing parameters
[fuzz]
runs = 256
max_test_rejects = 65536

# Invariant testing parameters
[invariant]
runs = 64
depth = 32
fail_on_revert = false

# Formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
